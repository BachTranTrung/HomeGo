<!-- Chatbot widget — paste vào cuối body mỗi trang -->
<button class="chatbot-bubble" id="chatbotToggle" title="Chat với HomeGo AI">💬</button>
<div class="chatbot-window" id="chatbotWindow">
  <div class="chatbot-header">
    <span>🤖 HomeGo AI Assistant</span>
    <button style="background:none;border:none;color:#fff;cursor:pointer;font-size:1.2rem;" id="chatbotClose">✕</button>
  </div>
  <div class="chatbot-messages" id="chatMessages">
    <div class="chat-msg bot">Xin chào! Tôi là HomeGo AI 🏠<br>Bạn cần tư vấn sản phẩm gì hôm nay?</div>
  </div>
  <div class="chatbot-input">
    <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." />
    <button id="chatSend">➤</button>
  </div>
</div>
