<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Đơn Hàng — HomeGo Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/public/css/style.css"/>
</head>
<body>
<div class="admin-sidebar">
  <div class="admin-brand">🏠 HomeGo<small>Quản trị hệ thống</small></div>
  <nav class="admin-nav">
    <a href="/pages/admin/dashboard.html">📊 Dashboard</a>
    <a href="/pages/admin/products.html">📦 Sản phẩm</a>
    <a href="/pages/admin/orders.html" class="active">🛒 Đơn hàng</a>
    <a href="/pages/admin/users.html">👥 Người dùng</a>
    <a href="/pages/admin/promotions.html">🏷️ Mã giảm giá</a>
  </nav>
  <div style="padding:12px;border-top:1px solid rgba(255,255,255,.08);">
    <a href="/index.html" style="display:flex;align-items:center;gap:8px;padding:10px 14px;color:rgba(255,255,255,.6);text-decoration:none;font-size:.88rem;">🏪 Xem cửa hàng</a>
    <a href="#" id="sideLogout" style="display:flex;align-items:center;gap:8px;padding:10px 14px;color:rgba(255,255,255,.6);text-decoration:none;font-size:.88rem;">🚪 Đăng xuất</a>
  </div>
</div>

<div class="admin-main">
  <div class="admin-topbar"><h4 style="font-family:'Playfair Display',serif;font-weight:800;margin:0;">🛒 Quản lý đơn hàng</h4></div>
  <div class="admin-content">
    <!-- Filter tabs -->
    <div class="d-flex gap-2 mb-3 flex-wrap" id="statusTabs"></div>
    <!-- Table -->
    <div class="hg-table">
      <table><thead><tr>
        <th>Mã ĐH</th><th>Khách hàng</th><th>Tổng tiền</th><th>Phương thức</th><th>Trạng thái</th><th>Ngày đặt</th><th>Thao tác</th>
      </tr></thead>
      <tbody id="ordersBody">
        <tr><td colspan="7" class="text-center py-4"><div class="spinner-border text-danger"></div></td></tr>
      </tbody>
      </table>
    </div>
    <!-- Pagination -->
    <nav class="mt-4" id="orderPagination"></nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/js/api.js"></script>
<script>
if (!requireAdmin()) throw '';
document.getElementById('sideLogout').addEventListener('click', e => { e.preventDefault(); logout(); });

const STATUS_LIST = [
  { val:'',          label:'Tất cả' },
  { val:'pending',   label:'Chờ xác nhận', cls:'status-pending' },
  { val:'confirmed', label:'Đã xác nhận',  cls:'status-confirmed' },
  { val:'shipping',  label:'Đang giao',    cls:'status-shipping' },
  { val:'delivered', label:'Đã giao',      cls:'status-delivered' },
  { val:'cancelled', label:'Đã hủy',       cls:'status-cancelled' },
];
const stMap = Object.fromEntries(STATUS_LIST.slice(1).map(s=>[s.val,s]));
let currentStatus='', currentPage=1;

// Render filter tabs
document.getElementById('statusTabs').innerHTML = STATUS_LIST.map(s => `
  <button class="btn btn-sm ${s.val===''?'btn-hg-primary':'btn-outline-secondary'}" id="tab-${s.val||'all'}" onclick="setStatus('${s.val}')">${s.label}</button>
`).join('');

function setStatus(val) {
  currentStatus=val; currentPage=1;
  document.querySelectorAll('#statusTabs button').forEach(b=>{
    b.className='btn btn-sm btn-outline-secondary';
  });
  document.getElementById(`tab-${val||'all'}`).className='btn btn-sm btn-hg-primary';
  loadOrders();
}

async function loadOrders() {
  const body = document.getElementById('ordersBody');
  body.innerHTML = '<tr><td colspan="7" class="text-center py-4"><div class="spinner-border text-danger"></div></td></tr>';
  const q = new URLSearchParams({ page: currentPage, limit: 20 });
  if (currentStatus) q.set('status', currentStatus);
  try {
    const data = await api.get(`/admin/orders?${q}`);
    if (!data.orders.length) {
      body.innerHTML='<tr><td colspan="7" class="text-center py-5 text-muted">Không có đơn hàng nào</td></tr>'; return;
    }
    body.innerHTML = data.orders.map(o => {
      const st = stMap[o.status]||{label:o.status,cls:''};
      return `<tr>
        <td><span style="color:var(--hg-red);font-weight:700;">#${o._id.slice(-8).toUpperCase()}</span></td>
        <td><div class="fw-bold" style="font-size:.85rem;">${o.user?.fullName||'—'}</div><small class="text-muted">${o.user?.email||''}</small></td>
        <td><strong>${fmtPrice(o.totalMoney)}</strong></td>
        <td><small>${o.paymentMethod==='cod'?'💵 COD':'🏦 VNPAY'}</small></td>
        <td>
          <select class="form-select form-select-sm ${st.cls}" style="border-radius:8px;font-weight:700;font-size:.78rem;padding:4px 8px;cursor:pointer;"
            onchange="updateStatus('${o._id}',this.value)">
            ${STATUS_LIST.slice(1).map(s=>`<option value="${s.val}" ${o.status===s.val?'selected':''}>${s.label}</option>`).join('')}
          </select>
        </td>
        <td style="color:#888;font-size:.8rem;">${fmtDateTime(o.createdAt)}</td>
        <td><small>${o.notes||'—'}</small></td>
      </tr>`;
    }).join('');

    // Pagination
    if (data.totalPages > 1) {
      let pg='<ul class="pagination pagination-sm justify-content-center">';
      for(let i=1;i<=data.totalPages;i++) pg+=`<li class="page-item ${i===currentPage?'active':''}"><button class="page-link" onclick="goPage(${i})">${i}</button></li>`;
      pg+='</ul>';
      document.getElementById('orderPagination').innerHTML=pg;
    } else document.getElementById('orderPagination').innerHTML='';
  } catch(e) { body.innerHTML=`<tr><td colspan="7" class="text-danger text-center">${e.message}</td></tr>`; }
}

function goPage(n) { currentPage=n; loadOrders(); }

async function updateStatus(id, status) {
  try { await api.put(`/admin/orders/${id}/status`, { status }); showToast('Cập nhật thành công!'); }
  catch(e) { showToast(e.message,'error'); loadOrders(); }
}

loadOrders();
</script>
</body>
</html>
