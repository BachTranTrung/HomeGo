<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Người Dùng — HomeGo Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/public/css/style.css"/>
</head>
<body>
<div class="admin-sidebar">
  <div class="admin-brand">🏠 HomeGo<small>Quản trị hệ thống</small></div>
  <nav class="admin-nav">
    <a href="/pages/admin/dashboard.html">📊 Dashboard</a>
    <a href="/pages/admin/products.html">📦 Sản phẩm</a>
    <a href="/pages/admin/orders.html">🛒 Đơn hàng</a>
    <a href="/pages/admin/users.html" class="active">👥 Người dùng</a>
    <a href="/pages/admin/promotions.html">🏷️ Mã giảm giá</a>
  </nav>
  <div style="padding:12px;border-top:1px solid rgba(255,255,255,.08);">
    <a href="/index.html" style="display:flex;align-items:center;gap:8px;padding:10px 14px;color:rgba(255,255,255,.6);text-decoration:none;font-size:.88rem;">🏪 Xem cửa hàng</a>
    <a href="#" id="sideLogout" style="display:flex;align-items:center;gap:8px;padding:10px 14px;color:rgba(255,255,255,.6);text-decoration:none;font-size:.88rem;">🚪 Đăng xuất</a>
  </div>
</div>

<div class="admin-main">
  <div class="admin-topbar"><h4 style="font-family:'Playfair Display',serif;font-weight:800;margin:0;">👥 Quản lý người dùng</h4></div>
  <div class="admin-content">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <input class="form-control" id="searchInput" placeholder="🔍 Tìm theo tên, email, username..." style="max-width:320px;" oninput="filterUsers()"/>
      <span class="text-muted small" id="userCount"></span>
    </div>
    <div class="hg-table">
      <table><thead><tr>
        <th>#</th><th>Người dùng</th><th>Email</th><th>SĐT</th><th>Vai trò</th><th>Ngày tạo</th>
      </tr></thead>
      <tbody id="usersBody">
        <tr><td colspan="6" class="text-center py-4"><div class="spinner-border text-danger"></div></td></tr>
      </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/js/api.js"></script>
<script>
if (!requireAdmin()) throw '';
document.getElementById('sideLogout').addEventListener('click', e=>{ e.preventDefault(); logout(); });

let allUsers=[];
async function loadUsers() {
  try {
    allUsers = await api.get('/admin/users');
    renderUsers(allUsers);
  } catch(e) { document.getElementById('usersBody').innerHTML=`<tr><td colspan="6" class="text-danger text-center">${e.message}</td></tr>`; }
}
function filterUsers() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderUsers(allUsers.filter(u=>(u.fullName||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q)||(u.username||'').toLowerCase().includes(q)));
}
function renderUsers(users) {
  document.getElementById('userCount').textContent = `${users.length} người dùng`;
  document.getElementById('usersBody').innerHTML = users.length ? users.map((u,i)=>`
    <tr>
      <td class="text-muted">${i+1}</td>
      <td>
        <div class="d-flex align-items-center gap-2">
          <div class="avatar-circle" style="width:36px;height:36px;font-size:.85rem;">${(u.fullName||u.username||'?')[0].toUpperCase()}</div>
          <div><div class="fw-bold" style="font-size:.88rem;">${u.fullName||'—'}</div><small class="text-muted">@${u.username||''}</small></div>
        </div>
      </td>
      <td style="font-size:.85rem;">${u.email}</td>
      <td style="font-size:.85rem;">${u.phone||'—'}</td>
      <td><span class="badge rounded-pill px-2 py-1" style="${u.role==='admin'?'background:#FFF0F1;color:var(--hg-red);':'background:#E8F5E9;color:#28A745;'}">${u.role==='admin'?'👑 Admin':'🧑 Khách'}</span></td>
      <td style="color:#888;font-size:.8rem;">${fmtDate(u.createdAt)}</td>
    </tr>`).join('') : '<tr><td colspan="6" class="text-center py-5 text-muted">Không tìm thấy người dùng</td></tr>';
}
loadUsers();
</script>
</body>
</html>
