<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Đơn Hàng Của Tôi — HomeGo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/public/css/style.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg hg-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/index.html">🏠 HomeGo</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <a class="text-white text-decoration-none" href="/pages/customer/profile.html">👤 <span id="userMenuName"></span></a>
      <a class="text-white text-decoration-none" href="/pages/customer/cart.html">🛒 <span class="cart-badge">0</span></a>
      <a href="#" class="text-white text-decoration-none" id="navLogoutLink">Đăng xuất</a>
    </div>
  </div>
</nav>

<div class="container py-4" style="max-width:860px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 style="font-family:'Playfair Display',serif;font-weight:800;">📦 Đơn Hàng Của Tôi</h2>
      <p class="text-muted mb-0">Theo dõi và quản lý đơn hàng</p>
    </div>
    <a href="/pages/customer/profile.html" class="btn btn-hg-outline btn-sm">← Tài khoản</a>
  </div>

  <div id="ordersWrap">
    <div class="hg-spinner"><div class="spinner-border text-danger"></div></div>
  </div>
</div>

<footer class="hg-footer"><div class="container"><div class="footer-bottom text-center">© 2025 HomeGo</div></div></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/js/api.js"></script>
<script>
if (!requireLogin()) throw '';

const STATUS = {
  pending:   { label:'Chờ xác nhận', cls:'status-pending' },
  confirmed: { label:'Đã xác nhận',  cls:'status-confirmed' },
  shipping:  { label:'Đang giao',    cls:'status-shipping' },
  delivered: { label:'Đã giao',      cls:'status-delivered' },
  cancelled: { label:'Đã hủy',       cls:'status-cancelled' },
};

async function loadOrders() {
  const wrap = document.getElementById('ordersWrap');
  try {
    const orders = await api.get('/orders/my');
    if (!orders.length) {
      wrap.innerHTML = `<div class="empty-box"><div class="ei">📦</div><h5>Chưa có đơn hàng nào</h5>
        <a href="/pages/customer/products.html" class="btn btn-hg-primary mt-3">Mua sắm ngay</a></div>`;
      return;
    }

    wrap.innerHTML = orders.map(o => {
      const st = STATUS[o.status] || STATUS.pending;
      const itemsHtml = o.items.map(i => `
        <div class="d-flex align-items-center gap-3 py-2 border-bottom">
          <img src="${i.imageUrl||'https://via.placeholder.com/52'}" style="width:52px;height:52px;object-fit:contain;border-radius:8px;background:#F8F9FA;flex-shrink:0;"/>
          <div class="flex-grow-1">
            <div style="font-weight:700;font-size:.88rem;line-height:1.3;">${i.name}</div>
            <small class="text-muted">Đơn giá: ${fmtPrice(i.unitPrice)} × ${i.quantity}</small>
          </div>
          <div class="fw-bold text-danger" style="white-space:nowrap;">${fmtPrice(i.unitPrice*i.quantity)}</div>
        </div>`).join('');

      return `
      <div class="card border-0 shadow-sm rounded-3 mb-3 overflow-hidden">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center p-3 bg-light" style="cursor:pointer;" onclick="toggleOrder('od-${o._id}')">
          <div>
            <span class="fw-bold" style="color:var(--hg-red);">Đơn #${o._id.slice(-8).toUpperCase()}</span>
            <span class="text-muted small ms-2">${fmtDateTime(o.createdAt)}</span>
          </div>
          <div class="d-flex align-items-center gap-3">
            <span class="badge rounded-pill px-3 py-2 ${st.cls}">${st.label}</span>
            <span class="fw-bold">${fmtPrice(o.totalMoney)}</span>
            <span class="text-muted">▼</span>
          </div>
        </div>
        <!-- Body -->
        <div id="od-${o._id}" style="display:none;">
          <div class="px-3 py-2">${itemsHtml}</div>
          <div class="bg-light px-3 py-2 d-flex justify-content-between align-items-center flex-wrap gap-2" style="font-size:.85rem;">
            <div class="text-muted">
              ${o.promoCode ? `🏷️ Mã: <strong>${o.promoCode}</strong> &nbsp;|&nbsp;` : ''}
              💳 ${o.paymentMethod==='cod'?'Thanh toán khi nhận hàng':'VNPAY'}
              ${o.notes ? ` &nbsp;|&nbsp; 📝 ${o.notes}` : ''}
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="fw-bold">Tổng: <span style="color:var(--hg-red);font-size:1.1rem;">${fmtPrice(o.totalMoney)}</span></span>
              ${o.status==='pending' ? `<button class="btn btn-sm" style="background:#FFF0F1;color:var(--hg-red);border:1px solid #FFD0D4;" onclick="cancelOrder('${o._id}')">Hủy đơn</button>` : ''}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  } catch(e) { wrap.innerHTML = `<p class="text-danger">${e.message}</p>`; }
}

function toggleOrder(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? '' : 'none';
}

async function cancelOrder(id) {
  if (!confirm('Bạn chắc chắn muốn hủy đơn hàng này?')) return;
  try {
    await api.put(`/orders/${id}/cancel`);
    showToast('Đã hủy đơn hàng!');
    loadOrders();
  } catch(e) { showToast(e.message, 'error'); }
}

loadOrders();
</script>
</body>
</html>
