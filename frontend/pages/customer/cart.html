<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Giỏ Hàng — HomeGo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/public/css/style.css"/>
</head>
<body>
<nav class="navbar navbar-expand-lg hg-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/index.html">🏠 HomeGo</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <a class="nav-link text-white" href="/pages/customer/products.html">Sản phẩm</a>
      <a class="nav-link position-relative text-white fw-bold" href="#">🛒 <span class="cart-badge">0</span></a>
      <span id="navLoginLink"><a class="btn btn-sm btn-light" href="/pages/customer/login.html">Đăng nhập</a></span>
      <span class="d-none text-white small" id="navLogoutLink">
        <a href="/pages/customer/profile.html" class="text-white text-decoration-none">👤 <span id="userMenuName"></span></a>
        &nbsp;|&nbsp;<a href="#" class="text-white" id="logoutBtn">Đăng xuất</a>
      </span>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h2 style="font-family:'Playfair Display',serif;font-weight:800;" class="mb-4">🛒 Giỏ Hàng</h2>

  <div id="emptyCart" class="empty-box" style="display:none;">
    <div class="ei">🛒</div>
    <h5>Giỏ hàng trống</h5>
    <p>Hãy thêm sản phẩm vào giỏ hàng nhé!</p>
    <a href="/pages/customer/products.html" class="btn btn-hg-primary mt-3">Mua sắm ngay</a>
  </div>

  <div id="loadingCart" class="hg-spinner"><div class="spinner-border text-danger"></div></div>

  <div id="cartContent" style="display:none;">
    <div class="row g-4">
      <div class="col-lg-8">
        <div id="cartItems"></div>
        <div class="d-flex justify-content-between align-items-center mt-2">
          <button class="btn btn-sm btn-outline-danger" onclick="doClearCart()">🗑️ Xóa tất cả</button>
          <a href="/pages/customer/products.html" class="btn btn-sm btn-hg-outline">← Tiếp tục mua sắm</a>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card border-0 shadow-sm rounded-3 p-4" style="position:sticky;top:80px;">
          <h5 class="fw-bold mb-4">Tóm tắt đơn hàng</h5>
          <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Tạm tính (<span id="itemCount">0</span> sản phẩm)</span>
            <span id="subtotalDisplay" class="fw-bold">0₫</span>
          </div>
          <div class="d-flex justify-content-between mb-3">
            <span class="text-muted">Vận chuyển</span>
            <span class="text-success fw-bold">Miễn phí</span>
          </div>
          <hr/>
          <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
            <span>Tổng cộng</span>
            <span style="color:var(--hg-red);" id="totalDisplay">0₫</span>
          </div>
          <button class="btn btn-hg-primary w-100 btn-lg" onclick="goCheckout()">
            Thanh toán →
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="hg-footer"><div class="container"><div class="footer-bottom text-center">© 2025 HomeGo. Bảo lưu mọi quyền.</div></div></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/js/api.js"></script>
<script>
// Logout button
document.getElementById('logoutBtn')?.addEventListener('click', e => { e.preventDefault(); logout(); });

let serverItems = [];   // khi login dùng server
let localItems  = [];   // khi chưa login dùng localStorage

async function loadCart() {
  document.getElementById('loadingCart').style.display = '';
  document.getElementById('cartContent').style.display = 'none';
  document.getElementById('emptyCart').style.display   = 'none';

  if (isLoggedIn()) {
    try {
      const data = await api.get('/cart');
      serverItems = data.items || [];
      renderServerCart(serverItems, data.total, data.count);
    } catch(e) {
      document.getElementById('loadingCart').style.display = 'none';
      showToast('Không thể tải giỏ hàng: ' + e.message, 'error');
    }
  } else {
    localItems = getCart();
    renderLocalCart();
  }
}

function renderServerCart(items, total, count) {
  document.getElementById('loadingCart').style.display = 'none';

  if (!items.length) {
    document.getElementById('emptyCart').style.display = '';
    return;
  }

  document.getElementById('cartContent').style.display = '';
  document.getElementById('itemCount').textContent     = count;
  document.getElementById('subtotalDisplay').textContent = fmtPrice(total);
  document.getElementById('totalDisplay').textContent    = fmtPrice(total);

  document.getElementById('cartItems').innerHTML = items.map(item => `
    <div class="card border-0 shadow-sm rounded-3 p-3 mb-3">
      <div class="d-flex align-items-center gap-3">
        <a href="/pages/customer/product-detail.html?id=${item.productId}">
          <img src="${item.imageUrl || 'https://via.placeholder.com/80'}"
               style="width:76px;height:76px;object-fit:contain;border-radius:8px;background:#F8F9FA;flex-shrink:0;"/>
        </a>
        <div class="flex-grow-1 min-w-0">
          <a href="/pages/customer/product-detail.html?id=${item.productId}"
             class="fw-bold text-dark text-decoration-none d-block"
             style="font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.name}</a>
          <div class="d-flex align-items-center gap-2 mt-1">
            <span class="text-danger fw-bold">${fmtPrice(item.salePrice)}</span>
            ${item.discount > 0 ? `<span class="badge" style="background:#FFF0F1;color:var(--hg-red);font-size:.72rem;">-${item.discount}%</span>` : ''}
          </div>
          ${item.stock <= 5 && item.stock > 0 ? `<small class="text-warning">⚠️ Chỉ còn ${item.stock} sản phẩm</small>` : ''}
        </div>
        <div class="d-flex align-items-center border rounded-3 overflow-hidden flex-shrink-0">
          <button class="btn btn-sm px-3" style="border:none;background:#F0F0F0;border-radius:0;"
            onclick="changeQtyServer('${item.cartItemId}', ${item.quantity - 1})">−</button>
          <span class="px-3 fw-bold" style="min-width:36px;text-align:center;">${item.quantity}</span>
          <button class="btn btn-sm px-3" style="border:none;background:#F0F0F0;border-radius:0;"
            onclick="changeQtyServer('${item.cartItemId}', ${item.quantity + 1}, ${item.stock})">+</button>
        </div>
        <div class="fw-bold text-nowrap" style="min-width:90px;text-align:right;flex-shrink:0;">
          ${fmtPrice(item.subtotal)}
        </div>
        <button class="btn btn-sm flex-shrink-0"
          style="color:#bbb;background:none;border:none;font-size:1.1rem;"
          onclick="removeServer('${item.cartItemId}')">✕</button>
      </div>
    </div>`).join('');
}

function renderLocalCart() {
  document.getElementById('loadingCart').style.display = 'none';
  if (!localItems.length) {
    document.getElementById('emptyCart').style.display = '';
    return;
  }
  document.getElementById('cartContent').style.display = '';
  const total = localItems.reduce((s, i) => s + i.price * i.quantity, 0);
  const count = localItems.reduce((s, i) => s + i.quantity, 0);
  document.getElementById('itemCount').textContent        = count;
  document.getElementById('subtotalDisplay').textContent  = fmtPrice(total);
  document.getElementById('totalDisplay').textContent     = fmtPrice(total);

  document.getElementById('cartItems').innerHTML = localItems.map(item => `
    <div class="card border-0 shadow-sm rounded-3 p-3 mb-3">
      <div class="d-flex align-items-center gap-3">
        <img src="${item.imageUrl || 'https://via.placeholder.com/76'}"
             style="width:76px;height:76px;object-fit:contain;border-radius:8px;background:#F8F9FA;flex-shrink:0;"/>
        <div class="flex-grow-1">
          <div class="fw-bold" style="font-size:.92rem;">${item.name}</div>
          <div class="text-danger fw-bold mt-1">${fmtPrice(item.price)}</div>
        </div>
        <div class="d-flex align-items-center border rounded-3 overflow-hidden">
          <button class="btn btn-sm px-3" style="border:none;background:#F0F0F0;border-radius:0;"
            onclick="changeQtyLocal('${item.productId}', ${item.quantity - 1})">−</button>
          <span class="px-3 fw-bold">${item.quantity}</span>
          <button class="btn btn-sm px-3" style="border:none;background:#F0F0F0;border-radius:0;"
            onclick="changeQtyLocal('${item.productId}', ${item.quantity + 1})">+</button>
        </div>
        <div class="fw-bold text-nowrap" style="min-width:90px;text-align:right;">
          ${fmtPrice(item.price * item.quantity)}
        </div>
        <button class="btn btn-sm" style="color:#bbb;background:none;border:none;font-size:1.1rem;"
          onclick="removeLocal('${item.productId}')">✕</button>
      </div>
    </div>`).join('');
}

// Server cart actions
async function changeQtyServer(itemId, qty, maxStock) {
  if (maxStock !== undefined && qty > maxStock) { showToast('Không đủ hàng tồn kho!', 'error'); return; }
  try {
    await api.put(`/cart/${itemId}`, { quantity: qty });
    loadCart();
  } catch(e) { showToast(e.message, 'error'); }
}
async function removeServer(itemId) {
  try { await api.delete(`/cart/${itemId}`); loadCart(); }
  catch(e) { showToast(e.message, 'error'); }
}
async function doClearCart() {
  if (!confirm('Xóa toàn bộ giỏ hàng?')) return;
  if (isLoggedIn()) {
    try { await api.delete('/cart'); loadCart(); }
    catch(e) { showToast(e.message, 'error'); }
  } else {
    localStorage.removeItem('cart'); loadCart();
  }
}

// Local cart actions
function changeQtyLocal(pid, qty) { updateCartQty(pid, qty); localItems = getCart(); renderLocalCart(); }
function removeLocal(pid)         { removeFromCart(pid); localItems = getCart(); renderLocalCart(); }

function goCheckout() {
  if (!isLoggedIn()) {
    showToast('Vui lòng đăng nhập để thanh toán!', 'error');
    setTimeout(() => location.href = '/pages/customer/login.html', 1000);
    return;
  }
  location.href = '/pages/customer/checkout.html';
}

loadCart();
</script>
</body>
</html>
