<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Thanh Toán — HomeGo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/public/css/style.css"/>
</head>
<body>
<nav class="navbar hg-navbar"><div class="container"><a class="navbar-brand" href="/index.html">🏠 HomeGo</a></div></nav>

<div class="container py-4">
  <h2 style="font-family:'Playfair Display',serif;font-weight:800;" class="mb-4">Thanh Toán</h2>
  <div class="row g-4">
    <!-- Form -->
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm rounded-3 p-4 mb-3">
        <h5 class="fw-bold mb-3">📍 Thông tin giao hàng</h5>
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label fw-bold">Họ tên *</label>
            <input class="form-control" id="shipName" placeholder="Nguyễn Văn A"/>
          </div>
          <div class="col-6">
            <label class="form-label fw-bold">SĐT *</label>
            <input class="form-control" id="shipPhone" placeholder="0901234567"/>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Email</label>
            <input class="form-control" id="shipEmail" type="email"/>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Địa chỉ giao hàng *</label>
            <textarea class="form-control" id="shipAddress" rows="2" placeholder="Số nhà, đường, phường, quận, tỉnh/TP"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label fw-bold">Ghi chú</label>
            <input class="form-control" id="orderNote" placeholder="Ghi chú đơn hàng (nếu có)"/>
          </div>
        </div>
      </div>

      <div class="card border-0 shadow-sm rounded-3 p-4">
        <h5 class="fw-bold mb-3">💳 Phương thức thanh toán</h5>
        <div class="d-flex flex-column gap-2">
          <label class="d-flex align-items-center gap-3 p-3 border rounded-3" style="cursor:pointer;">
            <input type="radio" name="payment" value="cod" checked id="payCOD"/> 
            <div><div class="fw-bold">💵 Thanh toán khi nhận hàng (COD)</div><small class="text-muted">Trả tiền mặt khi nhận hàng</small></div>
          </label>
          <label class="d-flex align-items-center gap-3 p-3 border rounded-3" style="cursor:pointer;">
            <input type="radio" name="payment" value="vnpay" id="payVNPay"/>
            <div><div class="fw-bold">🏦 VNPAY</div><small class="text-muted">Thanh toán online qua thẻ ATM, Visa, ví điện tử</small></div>
          </label>
        </div>
      </div>
    </div>

    <!-- Summary -->
    <div class="col-lg-5">
      <div class="card border-0 shadow-sm rounded-3 p-4 mb-3">
        <h5 class="fw-bold mb-3">Sản phẩm đặt hàng</h5>
        <div id="orderItemsList"></div>
      </div>
      <div class="card border-0 shadow-sm rounded-3 p-4">
        <h5 class="fw-bold mb-3">Mã giảm giá</h5>
        <div class="d-flex gap-2 mb-3">
          <input class="form-control" id="promoInput" placeholder="Nhập mã..." style="text-transform:uppercase;"/>
          <button class="btn btn-hg-outline" onclick="applyPromo()">Áp dụng</button>
        </div>
        <div id="promoMsg"></div>
        <hr/>
        <div class="d-flex justify-content-between mb-2"><span>Tạm tính</span><span id="ckSubtotal">0₫</span></div>
        <div class="d-flex justify-content-between mb-2 text-success" id="discountRow" style="display:none!important;">
          <span id="discountLabel">Giảm giá</span><span id="discountAmt">-0₫</span>
        </div>
        <div class="d-flex justify-content-between mb-3"><span>Vận chuyển</span><span class="text-success fw-bold">Miễn phí</span></div>
        <hr/>
        <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
          <span>Tổng cộng</span>
          <span style="color:var(--hg-red);" id="ckTotal">0₫</span>
        </div>
        <div id="ckError" class="alert alert-danger d-none"></div>
        <button class="btn btn-hg-primary w-100 btn-lg" id="placeOrderBtn" onclick="placeOrder()">✅ Đặt hàng ngay</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/js/api.js"></script>
<script>
if (!isLoggedIn()) location.href = '/pages/customer/login.html';

let promoData = null;
let cartData  = { items: [], total: 0 };  // dùng server cart
const user = getUser();
if (user) {
  document.getElementById('shipName').value  = user.fullName || '';
  document.getElementById('shipEmail').value = user.email    || '';
  document.getElementById('shipPhone').value = user.phone    || '';
}

async function initCheckout() {
  try {
    cartData = await api.get('/cart');
    if (!cartData.items || !cartData.items.length) { location.href = '/pages/customer/cart.html'; return; }
    renderOrderItems();
  } catch(e) {
    document.getElementById('ckError').textContent = 'Không tải được giỏ hàng: ' + e.message;
    document.getElementById('ckError').classList.remove('d-none');
  }
}

function renderOrderItems() {
  document.getElementById('orderItemsList').innerHTML = cartData.items.map(i => `
    <div class="d-flex align-items-center gap-2 mb-2">
      <img src="${i.imageUrl||'https://via.placeholder.com/48'}" style="width:48px;height:48px;object-fit:contain;border-radius:6px;background:#F8F9FA;flex-shrink:0;"/>
      <div class="flex-grow-1">
        <div style="font-size:.85rem;font-weight:700;line-height:1.3;">${i.name}</div>
        <small class="text-muted">x${i.quantity} × ${fmtPrice(i.salePrice)}</small>
      </div>
      <div class="fw-bold text-danger" style="font-size:.88rem;white-space:nowrap;">${fmtPrice(i.subtotal)}</div>
    </div>`).join('');
  updateTotals();
}

function updateTotals() {
  const sub  = cartData.total || 0;
  const disc = promoData ? Math.round(sub * promoData.discount / 100) : 0;
  const total= sub - disc;
  document.getElementById('ckSubtotal').textContent = fmtPrice(sub);
  document.getElementById('ckTotal').textContent    = fmtPrice(total);
  const row = document.getElementById('discountRow');
  if (disc > 0) {
    row.style.display = '';
    document.getElementById('discountLabel').textContent = `Giảm ${promoData.discount}%`;
    document.getElementById('discountAmt').textContent   = `-${fmtPrice(disc)}`;
  } else { row.style.display = 'none'; }
}

async function applyPromo() {
  const code = document.getElementById('promoInput').value.trim().toUpperCase();
  const msg  = document.getElementById('promoMsg');
  if (!code) return;
  try {
    promoData = await api.post('/promotions/check', { code });
    msg.innerHTML = `<div class="alert alert-success py-2">✅ Áp dụng thành công! Giảm ${promoData.discount}%</div>`;
    updateTotals();
  } catch(e) {
    promoData = null;
    msg.innerHTML = `<div class="alert alert-danger py-2">❌ ${e.message}</div>`;
    updateTotals();
  }
}

async function placeOrder() {
  const name    = document.getElementById('shipName').value.trim();
  const phone   = document.getElementById('shipPhone').value.trim();
  const address = document.getElementById('shipAddress').value.trim();
  const errEl   = document.getElementById('ckError');
  errEl.classList.add('d-none');

  if (!name || !phone || !address) {
    errEl.textContent = 'Vui lòng điền đầy đủ thông tin giao hàng!';
    errEl.classList.remove('d-none'); return;
  }

  const btn = document.getElementById('placeOrderBtn');
  btn.disabled = true; btn.textContent = 'Đang xử lý...';

  const payMethod = document.querySelector('input[name="payment"]:checked').value;
  const body = {
    items: cartData.items.map(i => ({ productId: i.productId, quantity: i.quantity })),
    promoCode: promoData?.code || '',
    notes: document.getElementById('orderNote').value.trim(),
    paymentMethod: payMethod,
    shipping: { customerName: name, email: document.getElementById('shipEmail').value, phone, address },
  };

  try {
    const res = await api.post('/orders', body);

    if (payMethod === 'vnpay') {
      const finalTotal = cartData.total - (promoData ? Math.round(cartData.total * promoData.discount / 100) : 0);
      const urlRes = await api.post('/payment/create-url', {
        orderId: res.order._id,
        amount: finalTotal,
        orderInfo: `Thanh toan don hang #${res.order._id}`,
      });
      window.location.href = urlRes.payUrl;
    } else {
      location.href = `/pages/customer/order-success.html?status=success&orderId=${res.order._id}`;
    }
  } catch(e) {
    errEl.textContent = e.message; errEl.classList.remove('d-none');
    btn.disabled = false; btn.textContent = '✅ Đặt hàng ngay';
  }
}

initCheckout();
</script>
</body>
</html>
