<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Đăng nhập — HomeGo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/public/css/style.css"/>
</head>
<body style="background:linear-gradient(135deg,var(--hg-red) 0%,#A8000F 50%,#1A1A2E 100%);min-height:100vh;display:flex;align-items:center;">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="row g-0">
          <!-- Left panel -->
          <div class="col-md-5 d-none d-md-flex flex-column justify-content-center align-items-center p-5" style="background:linear-gradient(135deg,var(--hg-red),#1A1A2E);color:#fff;">
            <div style="font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:800;margin-bottom:12px;">🏠 HomeGo</div>
            <p class="text-center" style="opacity:.85;font-size:.9rem;line-height:1.7;">Đồ gia dụng chính hãng<br>Giá tốt nhất, giao hàng nhanh</p>
            <div class="mt-4" style="font-size:.85rem;opacity:.7;">
              <div>✓ Hàng chính hãng 100%</div>
              <div>✓ Đổi trả 30 ngày</div>
              <div>✓ Giao hàng toàn quốc</div>
            </div>
          </div>

          <!-- Right panel: tabs -->
          <div class="col-md-7 p-4 p-md-5">
            <ul class="nav nav-tabs mb-4 border-0" id="authTabs">
              <li class="nav-item">
                <button class="nav-link active fw-bold px-4" id="loginTab" onclick="switchTab('login')">Đăng nhập</button>
              </li>
              <li class="nav-item">
                <button class="nav-link fw-bold px-4" id="registerTab" onclick="switchTab('register')">Đăng ký</button>
              </li>
            </ul>

            <!-- LOGIN FORM -->
            <div id="loginForm">
              <div id="loginError" class="alert alert-danger d-none"></div>
              <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="email@example.com"/>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Mật khẩu</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••"/>
              </div>
              <button class="btn btn-hg-primary w-100 btn-lg mb-3" id="loginBtn" onclick="doLogin()">Đăng nhập</button>

              <!-- Google Sign-In -->
              <div class="text-center mb-3"><span class="text-muted small">— hoặc —</span></div>
              <div id="g_id_onload"
                data-client_id="YOUR_GOOGLE_CLIENT_ID"
                data-callback="handleGoogleLogin"
                data-auto_prompt="false">
              </div>
              <div class="g_id_signin d-flex justify-content-center"
                data-type="standard"
                data-size="large"
                data-theme="outline"
                data-text="signin_with"
                data-locale="vi">
              </div>

              <p class="text-center mt-3 text-muted small">Demo: admin@homego.vn / admin123</p>
            </div>

            <!-- REGISTER FORM -->
            <div id="registerForm" style="display:none;">
              <div id="regError" class="alert alert-danger d-none"></div>
              <div id="regSuccess" class="alert alert-success d-none"></div>
              <div class="row g-2">
                <div class="col-6">
                  <label class="form-label fw-bold">Họ và tên</label>
                  <input type="text" class="form-control" id="regName" placeholder="Nguyễn Văn A"/>
                </div>
                <div class="col-6">
                  <label class="form-label fw-bold">Username *</label>
                  <input type="text" class="form-control" id="regUsername" placeholder="nguyenvana" required/>
                </div>
              </div>
              <div class="mt-2 mb-2">
                <label class="form-label fw-bold">Email *</label>
                <input type="email" class="form-control" id="regEmail" placeholder="email@example.com" required/>
              </div>
              <div class="mb-2">
                <label class="form-label fw-bold">Số điện thoại</label>
                <input type="tel" class="form-control" id="regPhone" placeholder="0901234567"/>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Mật khẩu * <small class="text-muted">(tối thiểu 6 ký tự)</small></label>
                <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required/>
              </div>
              <button class="btn btn-hg-primary w-100 btn-lg" onclick="doRegister()">Tạo tài khoản</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/public/js/api.js"></script>
<script>
// Nếu đã đăng nhập thì redirect
if (isLoggedIn()) location.href = '/index.html';

// Mở tab qua URL param
if (new URLSearchParams(location.search).get('tab') === 'register') switchTab('register');

function switchTab(tab) {
  document.getElementById('loginForm').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('loginTab').classList.toggle('active',    tab === 'login');
  document.getElementById('registerTab').classList.toggle('active', tab === 'register');
}

async function doLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl    = document.getElementById('loginError');
  const btn      = document.getElementById('loginBtn');
  if (!email || !password) { errEl.textContent='Vui lòng nhập email và mật khẩu'; errEl.classList.remove('d-none'); return; }
  btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
  try {
    const data = await api.post('/auth/login', { email, password });
    saveAuth(data);
    showToast('Đăng nhập thành công!');
    setTimeout(() => location.href = isAdmin() ? '/pages/admin/dashboard.html' : '/index.html', 800);
  } catch (e) {
    errEl.textContent = e.message; errEl.classList.remove('d-none');
    btn.disabled = false; btn.textContent = 'Đăng nhập';
  }
}

async function doRegister() {
  const body = {
    username: document.getElementById('regUsername').value.trim(),
    email:    document.getElementById('regEmail').value.trim(),
    password: document.getElementById('regPassword').value,
    fullName: document.getElementById('regName').value.trim(),
    phone:    document.getElementById('regPhone').value.trim(),
  };
  const errEl = document.getElementById('regError');
  const okEl  = document.getElementById('regSuccess');
  errEl.classList.add('d-none'); okEl.classList.add('d-none');
  if (!body.username || !body.email || !body.password) { errEl.textContent='Vui lòng điền đầy đủ thông tin bắt buộc'; errEl.classList.remove('d-none'); return; }
  try {
    await api.post('/auth/register', body);
    okEl.textContent = 'Đăng ký thành công! Đang chuyển sang đăng nhập...';
    okEl.classList.remove('d-none');
    setTimeout(() => switchTab('login'), 1500);
  } catch (e) { errEl.textContent = e.message; errEl.classList.remove('d-none'); }
}

// Google Sign-In callback
async function handleGoogleLogin(response) {
  try {
    // Decode JWT từ Google để lấy thông tin cơ bản
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    const data = await api.post('/auth/google', {
      googleId: payload.sub,
      email:    payload.email,
      fullName: payload.name,
      avatar:   payload.picture,
    });
    saveAuth(data);
    showToast('Đăng nhập Google thành công!');
    setTimeout(() => location.href = '/index.html', 800);
  } catch (e) { showToast(e.message, 'error'); }
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginForm').style.display !== 'none') doLogin();
  if (e.key === 'Enter' && document.getElementById('registerForm').style.display !== 'none') doRegister();
});
</script>
</body>
</html>
