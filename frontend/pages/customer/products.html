<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sản Phẩm — HomeGo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/public/css/style.css" />
</head>
<body>
<nav class="navbar navbar-expand-lg hg-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/index.html">🏠 HomeGo</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMenu">
      <form class="d-flex mx-auto search-bar" style="max-width:400px;width:100%;" id="searchForm">
        <input class="form-control" type="search" id="searchInput" placeholder="Tìm sản phẩm..." />
        <button class="btn px-3" type="submit" style="background:var(--hg-red-dark);color:#fff;">🔍</button>
      </form>
      <ul class="navbar-nav ms-auto align-items-center gap-2">
        <li class="nav-item"><a class="nav-link" href="/pages/customer/products.html">Sản phẩm</a></li>
        <li class="nav-item d-none" id="navAdminLink"><a class="nav-link" href="/pages/admin/dashboard.html">⚙️ Admin</a></li>
        <li class="nav-item" id="navLoginLink"><a class="nav-link btn btn-sm btn-light ms-2 px-3" href="/pages/customer/login.html">Đăng nhập</a></li>
        <li class="nav-item d-none" id="navLogoutLink"><a class="nav-link" href="#">👤 <span id="userMenuName"></span> | Đăng xuất</a></li>
        <li class="nav-item"><a class="nav-link position-relative" href="/pages/customer/cart.html">🛒 <span class="cart-badge">0</span></a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <div class="row g-4">
    <!-- Sidebar lọc -->
    <div class="col-lg-3">
      <div class="filter-card">
        <div class="filter-title">Danh mục</div>
        <div class="filter-item active" data-cat="" onclick="setFilter('category','')">Tất cả</div>
        <div id="catFilters" class="hg-spinner"><div class="spinner-border spinner-border-sm text-danger"></div></div>
      </div>
      <div class="filter-card">
        <div class="filter-title">Sắp xếp</div>
        <div class="filter-item active" data-sort="" onclick="setFilter('sort','')">Mới nhất</div>
        <div class="filter-item" data-sort="price_asc" onclick="setFilter('sort','price_asc')">Giá tăng dần</div>
        <div class="filter-item" data-sort="price_desc" onclick="setFilter('sort','price_desc')">Giá giảm dần</div>
        <div class="filter-item" data-sort="discount" onclick="setFilter('sort','discount')">Khuyến mãi nhiều</div>
      </div>
    </div>

    <!-- Danh sách sản phẩm -->
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0" id="pageHeading">Tất cả sản phẩm</h5>
        <span class="text-muted small" id="totalCount"></span>
      </div>
      <div class="row g-3" id="productGrid">
        <div class="col-12 hg-spinner"><div class="spinner-border text-danger"></div></div>
      </div>
      <nav class="mt-4" id="paginationWrap"></nav>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="hg-footer">
  <div class="container"><div class="footer-bottom text-center">© 2025 HomeGo. Bảo lưu mọi quyền.</div></div>
</footer>

<!-- Chatbot -->
<button class="chatbot-bubble" id="chatbotToggle">💬</button>
<div class="chatbot-window" id="chatbotWindow">
  <div class="chatbot-header"><span>🤖 HomeGo AI</span><button style="background:none;border:none;color:#fff;cursor:pointer;" id="chatbotClose">✕</button></div>
  <div class="chatbot-messages" id="chatMessages"><div class="chat-msg bot">Xin chào! Cần tư vấn sản phẩm gì không? 😊</div></div>
  <div class="chatbot-input"><input type="text" id="chatInput" placeholder="Nhập tin nhắn..." /><button id="chatSend">➤</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/js/api.js"></script>
<script src="/public/js/chatbot.js"></script>
<script>
let currentPage = 1;
const params = new URLSearchParams(window.location.search);
let filters = {
  category: params.get('category') || '',
  search:   params.get('search')   || '',
  sort:     params.get('sort')     || '',
  featured: params.get('featured') || '',
};

// Search
document.getElementById('searchForm').addEventListener('submit', e => {
  e.preventDefault();
  filters.search = document.getElementById('searchInput').value.trim();
  currentPage = 1; loadProducts();
});
if (filters.search) document.getElementById('searchInput').value = filters.search;

function setFilter(key, val) {
  filters[key] = val; currentPage = 1;
  document.querySelectorAll(`[data-${key}]`).forEach(el => el.classList.remove('active'));
  document.querySelector(`[data-${key}="${val}"]`)?.classList.add('active');
  loadProducts();
}

async function loadCategories() {
  const el = document.getElementById('catFilters');
  try {
    const cats = await api.get('/categories');
    el.innerHTML = cats.map(c => `
      <div class="filter-item ${filters.category === c._id ? 'active' : ''}" data-cat="${c._id}" onclick="setFilter('category','${c._id}')">
        ${c.icon} ${c.name} <small class="text-muted">(${c.productCount})</small>
      </div>`).join('');
  } catch { el.innerHTML = ''; }
}

async function loadProducts() {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '<div class="col-12 hg-spinner"><div class="spinner-border text-danger"></div></div>';

  const q = new URLSearchParams({ page: currentPage, limit: 12 });
  if (filters.category) q.set('category', filters.category);
  if (filters.search)   q.set('search',   filters.search);
  if (filters.sort)     q.set('sort',     filters.sort);
  if (filters.featured) q.set('featured', filters.featured);

  try {
    const data = await api.get(`/products?${q}`);
    document.getElementById('totalCount').textContent = `${data.total} sản phẩm`;
    document.getElementById('pageHeading').textContent =
      filters.search ? `Kết quả: "${filters.search}"` :
      filters.featured ? 'Sản phẩm nổi bật' : 'Tất cả sản phẩm';

    if (!data.products.length) {
      grid.innerHTML = `<div class="col-12 empty-box"><div class="ei">🔍</div><h5>Không tìm thấy sản phẩm</h5><p>Thử thay đổi bộ lọc hoặc từ khóa</p></div>`;
      document.getElementById('paginationWrap').innerHTML = '';
      return;
    }

    grid.innerHTML = data.products.map(p => productCardHTML(p)).join('');
    renderPagination(data.totalPages);
  } catch { grid.innerHTML = '<div class="col-12"><p class="text-danger text-center">Lỗi tải sản phẩm</p></div>'; }
}

function productCardHTML(p) {
  const salePrice = p.salePrice || Math.round(p.price * (1 - (p.discount||0)/100));
  return `
  <div class="col-6 col-md-4">
    <div class="product-card h-100">
      ${p.discount > 0 ? `<span class="badge-discount">-${p.discount}%</span>` : ''}
      <a href="/pages/customer/product-detail.html?id=${p._id}">
        <div class="card-img-wrap"><img src="${p.imageUrl||'https://via.placeholder.com/300'}" alt="${p.name}" loading="lazy"/></div>
      </a>
      <div class="card-body d-flex flex-column">
        <div class="cat-tag">${p.category?.name||''}</div>
        <div class="prod-name flex-grow-1"><a href="/pages/customer/product-detail.html?id=${p._id}" class="text-decoration-none text-dark">${p.name}</a></div>
        <div class="stars">${'★'.repeat(Math.round(p.avgRating||0))}${'☆'.repeat(5-Math.round(p.avgRating||0))} <small class="text-muted">(${p.reviewCount||0})</small></div>
        <div class="d-flex align-items-center gap-2 mt-1 mb-2">
          <span class="price-sale">${fmtPrice(salePrice)}</span>
          ${p.discount>0?`<span class="price-orig">${fmtPrice(p.price)}</span>`:''}
        </div>
        <button class="btn btn-hg-primary btn-sm w-100 mt-auto" onclick='handleAdd(${JSON.stringify(p)})'>🛒 Thêm vào giỏ</button>
      </div>
    </div>
  </div>`;
}

function renderPagination(total) {
  if (total <= 1) { document.getElementById('paginationWrap').innerHTML = ''; return; }
  let html = '<ul class="pagination justify-content-center">';
  for (let i = 1; i <= total; i++) {
    html += `<li class="page-item ${i===currentPage?'active':''}">
      <button class="page-link" onclick="goPage(${i})">${i}</button></li>`;
  }
  html += '</ul>';
  document.getElementById('paginationWrap').innerHTML = html;
}

function goPage(n) { currentPage = n; loadProducts(); window.scrollTo(0,0); }
function handleAdd(p) {
  if (!isLoggedIn()) { showToast('Vui lòng đăng nhập!', 'error'); return; }
  addToCart(p); showToast('Đã thêm vào giỏ hàng!');
}

loadCategories();
loadProducts();
</script>
</body>
</html>
