<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Đặt hàng thành công — HomeGo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="/public/css/style.css"/>
</head>
<body>
<nav class="navbar hg-navbar"><div class="container"><a class="navbar-brand" href="/index.html">🏠 HomeGo</a></div></nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm rounded-4 p-5 text-center" id="resultBox">
        <div class="hg-spinner"><div class="spinner-border text-danger"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="/public/js/api.js"></script>
<script>
const params  = new URLSearchParams(location.search);
const status  = params.get('status');
const orderId = params.get('orderId');

const box = document.getElementById('resultBox');

if (status === 'success') {
  box.innerHTML = `
    <div style="font-size:5rem;margin-bottom:20px;">🎉</div>
    <h2 style="font-family:'Playfair Display',serif;font-weight:800;color:#28A745;">Đặt hàng thành công!</h2>
    <p class="text-muted mt-2">Mã đơn hàng: <strong>#${orderId||''}</strong></p>
    <p class="text-muted" style="font-size:.92rem;line-height:1.7;">
      Cảm ơn bạn đã mua hàng tại HomeGo! Chúng tôi sẽ liên hệ xác nhận và giao hàng sớm nhất.
    </p>
    <div class="d-flex gap-3 justify-content-center mt-4">
      <a href="/pages/customer/orders.html" class="btn btn-hg-primary">Xem đơn hàng</a>
      <a href="/index.html" class="btn btn-outline-secondary">Về trang chủ</a>
    </div>`;
} else if (status === 'failed') {
  box.innerHTML = `
    <div style="font-size:5rem;margin-bottom:20px;">❌</div>
    <h2 style="font-family:'Playfair Display',serif;font-weight:800;color:var(--hg-red);">Thanh toán thất bại</h2>
    <p class="text-muted mt-2">Giao dịch VNPay không thành công hoặc bị hủy.</p>
    <div class="d-flex gap-3 justify-content-center mt-4">
      <a href="/pages/customer/cart.html" class="btn btn-hg-primary">Thử lại</a>
      <a href="/index.html" class="btn btn-outline-secondary">Về trang chủ</a>
    </div>`;
} else {
  box.innerHTML = `
    <div style="font-size:5rem;margin-bottom:20px;">⚠️</div>
    <h2 style="font-family:'Playfair Display',serif;font-weight:800;">Không xác định</h2>
    <p class="text-muted">Trạng thái đơn hàng không rõ ràng.</p>
    <a href="/index.html" class="btn btn-hg-primary mt-3">Về trang chủ</a>`;
}
</script>
</body>
</html>
